name: Publish npm

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'shanthropic/opencode-account-rotate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Verify release identity and unpublished version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'opencode-account-rotate');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `npm-v${pkg.version}`);
          assert.equal(pkg.repository.url, 'git+https://github.com/shanthropic/opencode-account-rotate.git');
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          assert.equal(response.status, 404, `Expected unpublished version; registry returned ${response.status}`);
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: node .github/scripts/verify-package.mjs
      - name: Publish using OIDC (no npm token)
        run: npm publish --access public --ignore-scripts
